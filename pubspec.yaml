name: petmatch
description: Aplicacion movil de adopcion responsable de mascotas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.0
  go_router: ^14.2.0
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0
  flutter_image_compress: ^2.3.0
  flutter_local_notifications: ^17.2.2
  shimmer: ^3.0.0
  timeago: ^3.7.0
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.6.4
  build_runner: ^2.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
